  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity=".08" stroke-width="3"/>
  <circle cx="256" cy="256" r="215" fill="url(#halo)"/>
  <g stroke="#10b981" stroke-opacity=".07" stroke-width="2">
    <path d="M96 0v512M176 0v512M256 0v512M336 0v512M416 0v512M0 96h512M0 176h512M0 256h512M0 336h512M0 416h512"/>
  </g>
  <!-- dona de gastos: 3 segmentos -->
  <g filter="url(#glow)" fill="none" stroke-width="36" stroke-linecap="round">
    <path d="M256 102 A154 154 0 0 1 398 312" stroke="url(#g1)"/>
    <path d="M372 356 A154 154 0 0 1 150 368" stroke="url(#g2)"/>
    <path d="M118 326 A154 154 0 0 1 214 108" stroke="url(#g3)"/>
  </g>
  <!-- nodos -->
  <g fill="#fcd34d"><circle cx="256" cy="62" r="8"/><circle cx="452" cy="256" r="6"/><circle cx="60" cy="256" r="6"/></g>
