    </filter>
    <radialGradient id="halo" cx=".5" cy=".48" r=".55">
      <stop offset="0" stop-color="#10b981" stop-opacity=".2"/><stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
